name: Windows defect proof
on:
  push:
    branches: ['compat/fixes-20261119']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install known SVN distribution
        shell: pwsh
        run: |
          choco install sliksvn --version=1.14.5 --yes --no-progress
          "CCGUI_SVN_EXE=C:\Program Files\SlikSvn\bin\svn.exe" >> $env:GITHUB_ENV
      - name: Record Windows encoding environment
        shell: pwsh
        run: |
          Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class NativeEncoding { [DllImport("kernel32.dll")] public static extern uint GetACP(); [DllImport("kernel32.dll")] public static extern uint GetConsoleCP(); [DllImport("kernel32.dll")] public static extern uint GetConsoleOutputCP(); }'
          @{ ACP=[NativeEncoding]::GetACP(); ConsoleCP=[NativeEncoding]::GetConsoleCP(); ConsoleOutputCP=[NativeEncoding]::GetConsoleOutputCP(); Shell=$PSVersionTable.PSVersion.ToString(); Culture=[cultureinfo]::CurrentCulture.Name; LANG=$env:LANG; LC_ALL=$env:LC_ALL } | ConvertTo-Json | Out-File windows-encoding.json -Encoding utf8
          Get-Content windows-encoding.json
      - run: node test/windows-defects.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-defect-proof
          path: |
            windows-defects.json
            windows-encoding.json
